<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulb</title>
    <style>

        *{
            border: 0px;
            padding: 0px;
        }

        body{
            display: flex;
            justify-content: center;
            text-align: center;
            height: 100vh;
            align-items: center;
            
        }

        #part1{

            border-radius: 10px;
            background-color: aqua;
            /* position: absolute; */
            box-shadow:0 1px 10px  aqua;
            text-align: center;
            padding: 20px;
                 
        }

        .add{

            margin-left: 30px;
            height: 50px;
        }

        img{
            border-radius: 50%;
            height: 80px;
            margin: 10px 0;
            
            
        
            }


        button{
            padding: 6px 12px;
            margin: 5px;
            border: none;
            background-color: yellow;
            color: black;
            border-radius: 5px;
            cursor: pointer;
            

        }  
        
        button:hover{

            box-shadow: 0 4px 10px yellowgreen;
        }

        #light{

            align-items: center;
            bottom: 100px;
            margin-top:580px;
            margin-right: 100px;
            position: absolute;
        
        }

         #dark{

            align-items: center;
            bottom: 100px;
            margin-top:400px;
            margin-left: 110px;
            position: absolute;
        
        }
    </style>
</head>
<body>
    <div id="part1">
     
        <p>Bulb </p><br>

        <img src="./bulb-off.png" alt="image" id="bulboff">

        <div class="counter" id="count">0</div>

        <button onclick="add()">+</button>
        <button onclick="sub()">-</button>
       
        <br><br>
        <!-- <img src="bulb-on.png" alt="" id="bulbon"> -->
        


        <button onclick="lighton()">ON</button>
        <button onclick="lightoff()">OFF</button>
     
    </div>

    <button id="light" onclick="light()">Light</button>
    <button id="dark" onclick="dark()">Dark</button>


    <script>

        

        function lighton(){

            var image = document.getElementById("bulboff")
            image.src= "./bulb-on.png"
            
    

        }

      function lightoff(){

            var image = document.getElementById("bulboff")
            image.src = "./bulb-off.png";
    

        }

        let count = 0;

        function add(){
            count++;
            document.getElementById("count").innerText=count;;
        }

        function sub(){
            if(count>0){
            count--;
            document.getElementById("count").innerText = count;
        }
    }

     function light(){

        document.querySelector("body").style.backgroundColor="white";
        

        
    }

    function dark(){

        document.querySelector("body").style.backgroundColor="black";
        

        
    }
  
        

    </script>
</body>
</html>
