<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Show-list</title>
    <script src="jquery-4.0.0.js"></script>
</head>
<body>
    
 <button id="btn">Show List</button>

<ul id="list" style="display:none;">
    <li>Apple</li>
    <li>Banana</li>
    <li>Mango</li>
</ul>  

<script>

    $(document).ready(function(){

    $("#btn").click(function(){
        $("#list").show();
    });

});

</script>


</body>
</html>
